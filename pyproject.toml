[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sep-ai"
version = "0.1.0"
description = "First-party browser AI assistant without external AI APIs or models"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.14",
    "uvicorn==0.34.3",
]

[tool.ruff]
line-length = 100
target-version = "py310"
